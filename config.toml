# BlurPass configuration
# Thresholds marked [preset] are also shifted by --strictness low|medium|high

[categories]
# Which content categories to scan for. Category definitions (CLIP prompts +
# VLM question wording) live in detector.py; thresholds live in per-category
# sections below.
enabled = ["gore", "nudity"]

[sampling]
fps = 2.0            # frames sampled per second of video (2.0 halves the worst-case
                     # delay between content appearing and the blur starting)
max_frames = 20000   # hard cap per video; fps is lowered automatically if exceeded
thumb_size = 512     # longest edge (px) of sampled frames

[clip]
# Stage A model, shared across categories. Prompts live in detector.py.
# The cinematic-safe prompt lesson: without dark-mood safe prompts, dimly-lit
# thrillers false-flag 80%+ of frames.
model = "ViT-B-32"
pretrained = "laion2b_s34b_b79k"
device = "auto"          # auto | cuda | cpu

[gore]
clip_threshold = 0.45    # [preset] P(gore) at/above this sends the frame to stage B
vlm_threshold = 0.70     # [preset] P(gore) at/above this confirms a frame

[nudity]
# Uncalibrated on true positives (no nude content in the test corpus). On a
# film with zero nudity (Sixth Sense), underwear/bathroom scenes peaked at
# 0.84 and fully-clothed noise at 0.73 - so 0.85 yields zero false positives
# there. Animated content is excluded by the VLM question (see detector.py).
# When you have real content to calibrate on, use the report + eval harness.
clip_threshold = 0.40
vlm_threshold = 0.85

[vlm]
# Stage B: judgment call on CLIP-flagged frames only.
# qwen25vl_7b is the calibrated judge: on hand-labeled movie frames it
# separated TP (>=0.82) from FP (<=0.22) perfectly; the 3B could not (FP 0.69 >
# a TP 0.38). 7B needs ~16GB VRAM and runs ~3-7 confirmations/s.
# Known frontier (v1): medium-shot gore at 0.68 and an FP at 0.68 are
# inseparable; threshold 0.70 accepts that trade.
backend = "qwen25vl_7b"  # qwen25vl_7b | qwen25vl_3b | shieldgemma2_4b | none
device = "auto"
dtype = "bfloat16"
max_frames = 4000        # safety cap per category per video; when exceeded, the
                         # VLM budget goes to the most suspicious frames and the
                         # rest are treated as clean

[segments]
merge_gap = 2.0      # flagged runs closer than this (seconds) merge into one segment
pad = 1.5            # blur this many seconds before/after each segment (covers the
                     # sampling delay between content appearing and the next sample)
min_duration = 1.0   # discard segments shorter than this (after padding)

[render]
filter = "gblur"     # gblur | boxblur | pixelize
sigma = 30           # blur strength (gblur sigma; other filters derive from it)
encoder = "auto"     # auto (h264_nvenc if available, else libx264) | h264_nvenc | libx264
cq = 23

[presets]
# strictness -> per-category threshold shifts. Lower = more sensitive = more blur.
low    = { clip_shift = 0.20, vlm_shift = 0.10 }
medium = { clip_shift = 0.00, vlm_shift = 0.00 }
high   = { clip_shift = -0.15, vlm_shift = -0.10 }

[report]
max_thumbs_per_segment = 12
